services:
  postgres:
    image: postgres:16
    container_name: trakyane-postgres
    environment:
      POSTGRES_USER: trakyane
      POSTGRES_PASSWORD: trakyane
      POSTGRES_DB: trakyane
    ports:
      - "5432:5432"
    volumes:
      - trakyane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trakyane -d trakyane"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  trakyane_pg:
